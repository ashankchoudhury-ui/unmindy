<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>UNMINDY Launch</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=block"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background-color: #000000;
        font-family: "Inter", sans-serif;
        color: #f5f5f5;
      }

      /* Transition overlay */
      #white-wipe {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background-color: #ffffff;
        z-index: 100;
        pointer-events: none;
        transform: translateX(-1080px);
      }

      /* Scene base */
      .scene {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        z-index: 1;
      }

      /* Typography */
      .dim { color: #555555; }
      .label {
        font-size: 48px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .stat {
        font-size: 240px;
        font-weight: 900;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      .headline {
        font-size: 120px;
        font-weight: 800;
        line-height: 1.1;
      }
      .sub {
        font-size: 56px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      /* Layout helpers */
      .stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }
      .center { text-align: center; }

      /* Geometric shapes */
      .geo {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .geo-circle {
        border-radius: 50%;
        border: 2px solid #333333;
      }
      .geo-square {
        border: 2px solid #2a2a2a;
      }

      /* Scene-specific */
      #scene-1 { z-index: 10; }
      #scene-2 { z-index: 10; }
      #scene-3 { z-index: 10; }
      #scene-4 { z-index: 10; }
      #scene-5 { z-index: 10; }
      #scene-6 { z-index: 10; }

      .logo-img {
        width: 140px;
        height: 140px;
        object-fit: contain;
      }

      /* Audio */
      #narration {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="unmindy-launch"
      data-start="0"
      data-duration="35"
      data-width="1080"
      data-height="1920"
    >
      <!-- Audio -->
      <audio
        id="narration"
        data-start="0"
        data-duration="35"
        data-track-index="0"
        src="assets/narration-timed.wav"
      ></audio>

      <!-- Transition wipe -->
      <div id="white-wipe"></div>

      <!-- Scene 1: 0-5s -->
      <div id="scene-1" class="scene">
        <div class="stack" style="margin-top: -120px;">
          <div class="label dim">THE AVERAGE PERSON</div>
          <div class="stat">147×</div>
          <div class="sub dim">DAILY UNLOCKS</div>
        </div>
        <img class="geo logo-img" id="s1-logo" src="assets/pause-bars.png" style="top: 1400px; left: 50%; transform: translateX(-50%);" />
        <div class="geo geo-circle" id="s1-c1" style="width: 160px; height: 160px; top: 1200px; left: 180px;"></div>
        <div class="geo geo-square" id="s1-s1" style="width: 100px; height: 100px; top: 1500px; right: 200px;"></div>
      </div>

      <!-- Scene 2: 5-10s -->
      <div id="scene-2" class="scene">
        <div class="headline center" style="max-width: 900px; line-height: 1.2;">
          Most of it<br />isn't even<br />your choice.
        </div>
      </div>

      <!-- Scene 3: 10-15s -->
      <div id="scene-3" class="scene">
        <div class="stack" style="margin-top: -100px;">
          <div class="label dim">THE PROBLEM</div>
          <div class="headline" style="font-size: 110px;">Your brain<br />is on autopilot.</div>
        </div>
      </div>

      <!-- Scene 4: 15-22s -->
      <div id="scene-4" class="scene">
        <div class="stack" style="gap: 40px;">
          <img class="logo-img" id="s4-logo" src="assets/pause-bars.png" style="margin-top: 60px;" />
          <div class="stat" style="font-size: 150px;">UNMINDY</div>
          <div class="sub dim">CATCHES YOU IN 3 SECONDS</div>
        </div>
      </div>

      <!-- Scene 5: 22-27s -->
      <div id="scene-5" class="scene">
        <div class="stack" style="gap: 20px;">
          <div class="stat" style="font-size: 130px; letter-spacing: -0.02em;">Catch.</div>
          <div class="stat" style="font-size: 130px; letter-spacing: -0.02em;">Ask.</div>
          <div class="stat" style="font-size: 130px; letter-spacing: -0.02em;">Lock.</div>
        </div>
      </div>

      <!-- Scene 6: 27-35s -->
      <div id="scene-6" class="scene">
        <div class="stack" style="gap: 30px;">
          <div class="stat" style="font-size: 180px;">UNMINDY</div>
          <div class="headline" style="font-size: 72px; font-weight: 700;">Break the scroll.</div>
          <div class="sub dim" style="font-size: 44px;">landing-nine-pi-85.vercel.app</div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true, defaults: { duration: 0.5 } });

        // Ensure wipe starts off-screen
        tl.set("#white-wipe", { x: -1080 }, 0);

        // Helper: scene entrance with snappy eases
        const sceneIn = (id, time, ease = "power3.out") => {
          tl.to(`#${id}`, { opacity: 1, duration: 0.15 }, time);
        };
        const sceneOut = (id, time) => {
          tl.to(`#${id}`, { opacity: 0, duration: 0.15 }, time);
        };

        // --- Scene 1: 0-5s ---
        sceneIn("scene-1", 0.1);
        tl.from("#scene-1 .label", { y: 40, opacity: 0, duration: 0.6, ease: "back.out(1.4)" }, 0.2);
        tl.from("#scene-1 .stat", { scale: 0.6, opacity: 0, duration: 0.7, ease: "back.out(1.7)" }, 0.4);
        tl.from("#scene-1 .sub", { y: 30, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.8);
        tl.from("#s1-logo", { scale: 0, rotation: -20, duration: 0.7, ease: "back.out(1.7)" }, 1.0);
        tl.from("#s1-c1", { scale: 0, opacity: 0, duration: 0.6, ease: "back.out(1.4)" }, 0.6);
        tl.from("#s1-s1", { scale: 0, opacity: 0, duration: 0.6, ease: "back.out(1.4)" }, 0.8);

        // Transition 1→2
        tl.to("#white-wipe", { x: 0, duration: 0.2, ease: "power2.in" }, 4.8);
        sceneOut("scene-1", 5.0);
        tl.to("#white-wipe", { x: 1080, duration: 0.25, ease: "power3.out" }, 5.1);

        // --- Scene 2: 5-10s ---
        sceneIn("scene-2", 5.2);
        tl.from("#scene-2 .headline", { y: 60, opacity: 0, duration: 0.7, ease: "expo.out" }, 5.3);

        // Transition 2→3
        tl.to("#white-wipe", { x: 0, duration: 0.2, ease: "power2.in" }, 9.7);
        sceneOut("scene-2", 9.9);
        tl.to("#white-wipe", { x: 1080, duration: 0.25, ease: "power3.out" }, 10.0);

        // --- Scene 3: 10-15s ---
        sceneIn("scene-3", 10.1);
        tl.from("#scene-3 .label", { y: 30, opacity: 0, duration: 0.5, ease: "back.out(1.4)" }, 10.2);
        tl.from("#scene-3 .headline", { y: 50, opacity: 0, duration: 0.7, ease: "power3.out" }, 10.4);

        // Transition 3→4
        tl.to("#white-wipe", { x: 0, duration: 0.2, ease: "power2.in" }, 14.7);
        sceneOut("scene-3", 14.9);
        tl.to("#white-wipe", { x: 1080, duration: 0.25, ease: "power3.out" }, 15.0);

        // --- Scene 4: 15-22s ---
        sceneIn("scene-4", 15.1);
        tl.from("#s4-logo", { scale: 0, rotation: -15, duration: 0.7, ease: "back.out(1.7)" }, 15.2);
        tl.from("#scene-4 .stat", { y: 40, opacity: 0, duration: 0.7, ease: "back.out(1.4)" }, 15.5);
        tl.from("#scene-4 .sub", { y: 20, opacity: 0, duration: 0.5, ease: "power3.out" }, 15.9);

        // Transition 4→5
        tl.to("#white-wipe", { x: 0, duration: 0.2, ease: "power2.in" }, 21.6);
        sceneOut("scene-4", 21.8);
        tl.to("#white-wipe", { x: 1080, duration: 0.25, ease: "power3.out" }, 21.9);

        // --- Scene 5: 22-27s ---
        sceneIn("scene-5", 22.0);
        tl.from("#scene-5 .stat", { y: 50, opacity: 0, stagger: 0.12, duration: 0.6, ease: "back.out(1.4)" }, 22.1);

        // Transition 5→6
        tl.to("#white-wipe", { x: 0, duration: 0.2, ease: "power2.in" }, 26.7);
        sceneOut("scene-5", 26.9);
        tl.to("#white-wipe", { x: 1080, duration: 0.25, ease: "power3.out" }, 27.0);

        // --- Scene 6: 27-35s ---
        sceneIn("scene-6", 27.1);
        tl.from("#scene-6 .stat", { scale: 0.7, opacity: 0, duration: 0.7, ease: "back.out(1.7)" }, 27.2);
        tl.from("#scene-6 .headline", { y: 30, opacity: 0, duration: 0.6, ease: "power3.out" }, 27.6);
        tl.from("#scene-6 .sub", { y: 20, opacity: 0, duration: 0.5, ease: "power3.out" }, 27.9);

        // Fade out final
        tl.to("#white-wipe", { opacity: 1, duration: 0.5 }, 34.0);

        window.__timelines["unmindy-launch"] = tl;
      </script>
    </div>
  </body>
</html>
