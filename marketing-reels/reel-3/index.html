<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reel 3: POV Autopilot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #000; color: #f5f5f5; overflow: hidden; }
    .scene { width: 100vw; height: 100vh; position: relative; overflow: hidden; }
    .scene-content { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .pov-text { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
    .highlight { background: rgba(245,245,245,0.1); padding: 0.1rem 0.3rem; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="scene" data-composition-id="reel-3-pov-autopilot" data-duration="15">
    <div class="scene-content" style="background: #000;">
      <div id="scene1" style="text-align: center; max-width: 600px;">
        <div class="pov-text" style="opacity: 0;">
          <span class="highlight">POV:</span> You opened Instagram<br />without even thinking about it.
        </div>
        <div style="font-size: 1rem; color: #555; margin-top: 2rem; opacity: 0;" id="scene1-sub">Your brain is on autopilot.</div>
      </div>
      <div id="scene2" style="text-align: center; max-width: 600px; opacity: 0;">
        <div class="pov-text" style="font-size: 2rem;">UNMINDY catches you<br /><span style="font-weight:900;">in 3 seconds.</span></div>
        <div style="font-size: 0.9rem; color: #777; margin-top: 1.5rem;">One question: lock in or keep scrolling?</div>
        <div style="font-size: 0.85rem; color: #555; margin-top: 2rem;">No guilt. No to-do lists. Just focus.</div>
      </div>
      <div id="scene3" style="text-align: center; opacity: 0;">
        <div style="font-size: 1.8rem; font-weight: 900; letter-spacing: -0.03em;">Stop saying "later."</div>
        <div style="font-size: 0.9rem; color: #777; margin-top: 1rem;">Waitlist link in bio ↓</div>
      </div>
    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.from('#scene1 .pov-text', { opacity: 0, y: 30, duration: 1.2 })
      .from('#scene1 .highlight', { background: 'rgba(245,245,245,0)', duration: 0.8 }, 0.5)
      .fromTo('#scene1-sub', { opacity: 0 }, { opacity: 1, duration: 0.8 }, 2);
    tl.to('#scene1', { opacity: 0, duration: 0.5 }, 6)
      .fromTo('#scene2', { opacity: 0 }, { opacity: 1, duration: 0.8 }, 6.3)
      .from('#scene2 > div:first-child', { y: 30, opacity: 0, duration: 1 }, 6.5)
      .from('#scene2 > div:nth-child(2)', { y: 20, opacity: 0, duration: 0.7 }, 7)
      .from('#scene2 > div:nth-child(3)', { y: 15, opacity: 0, duration: 0.6 }, 7.3)
      .to('#scene2', { opacity: 0, duration: 0.5 }, 11);
    tl.fromTo('#scene3', { opacity: 0 }, { opacity: 1, duration: 0.8 }, 12)
      .from('#scene3 > div:first-child', { y: 20, opacity: 0, duration: 0.7 }, 12.3)
      .from('#scene3 > div:nth-child(2)', { y: 15, opacity: 0, duration: 0.5 }, 12.7);
    window.__timelines['reel-3-pov-autopilot'] = tl;
  </script>
</body>
</html>
