<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reel 1: 147 Unlocks</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #000; color: #f5f5f5; overflow: hidden; }
    .scene { width: 100vw; height: 100vh; position: relative; overflow: hidden; }
    .scene-content { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    .phone-mockup { width: 280px; height: 560px; background: #0a0a0a; border-radius: 36px; padding: 8px; border: 2px solid #1a1a1a; position: relative; }
    .phone-screen { width: 100%; height: 100%; background: #000; border-radius: 28px; overflow: hidden; position: relative; }
    .feed-line { height: 12px; background: #1a1a1a; border-radius: 6px; margin-bottom: 8px; }
    .stat-number { font-size: 4.5rem; font-weight: 900; letter-spacing: -0.04em; line-height: 0.9; }
    .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
  </style>
</head>
<body>
  <div class="scene" data-composition-id="reel-1-147-unlocks" data-duration="15">
    <div class="scene-content" style="background: #000;">
      <div class="phone-mockup" id="scene1">
        <div class="phone-screen">
          <div style="padding: 20px 12px;">
            <div class="feed-line" style="width:80%"></div>
            <div class="feed-line" style="width:60%"></div>
            <div class="feed-line" style="width:90%"></div>
            <div class="feed-line" style="width:70%"></div>
            <div class="feed-line" style="width:85%"></div>
            <div class="feed-line" style="width:75%"></div>
            <div class="feed-line" style="width:80%"></div>
            <div class="feed-line" style="width:60%"></div>
          </div>
        </div>
      </div>
      <div class="overlay" id="scene2" style="opacity:0;">
        <div class="stat-number">147×</div>
        <div style="font-size:1rem;color:#777;margin-top:0.5rem;">daily unlocks</div>
        <div style="font-size:0.85rem;color:#555;margin-top:2rem;">Most of it wasn't even your choice.</div>
      </div>
      <div class="overlay" id="scene3" style="opacity:0;">
        <div style="font-size:1.5rem;font-weight:800;letter-spacing:-0.02em;">UNMINDY</div>
        <div style="font-size:0.9rem;color:#777;margin-top:1rem;">I built something to stop it.</div>
        <div style="font-size:0.8rem;color:#555;margin-top:2rem;">Waitlist in bio ↓</div>
      </div>
    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.from('#scene1', { opacity: 0, scale: 0.9, duration: 1 })
      .to('#scene1 .feed-line', { opacity: 0.3, duration: 0.3, stagger: 0.1, repeat: 2, yoyo: true }, 0.5);
    tl.to('#scene1', { opacity: 0, duration: 0.5 }, 5)
      .fromTo('#scene2', { opacity: 0 }, { opacity: 1, duration: 0.8 }, 5.2)
      .from('#scene2 .stat-number', { scale: 0.5, opacity: 0, duration: 0.6 }, 5.5)
      .to('#scene2', { opacity: 0, duration: 0.5 }, 9);
    tl.fromTo('#scene3', { opacity: 0 }, { opacity: 1, duration: 0.8 }, 10)
      .from('#scene3 > div:first-child', { y: 20, opacity: 0, duration: 0.6 }, 10.3)
      .from('#scene3 > div:nth-child(2)', { y: 15, opacity: 0, duration: 0.5 }, 10.6)
      .from('#scene3 > div:nth-child(3)', { y: 10, opacity: 0, duration: 0.4 }, 10.9);
    window.__timelines['reel-1-147-unlocks'] = tl;
  </script>
</body>
</html>
